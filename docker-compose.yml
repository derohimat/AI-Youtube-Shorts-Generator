version: '3.8'

services:
  youtube-shorts-generator:
    build: .
    image: ai-youtube-shorts-generator:latest
    container_name: youtube-shorts-generator
    
    # Enable GPU support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    # Environment variables
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    
    # Mount .env file for OpenAI API key
    env_file:
      - .env
    
    # Web UI at http://localhost:7860
    ports:
      - "7860:7860"

    # Mount volumes for input/output
    volumes:
      - ./videos:/app/videos          # Put local videos here (use /app/videos/<file> as the source)
      - ./output:/app/output          # Finished shorts
      - ./work:/app/work              # Downloads + transcript cache
      - ./.env:/app/.env:ro           # API keys (read-only)

    stdin_open: true
    tty: true

    # Default: web UI. CLI example:
    #   docker-compose run youtube-shorts-generator ./run.sh "https://youtu.be/VIDEO_ID" --auto-approve
    command: ./run.sh
